<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="image/x-icon" href="Cric stream Favicon.jpg">
    <title>Premium IPTV Player</title>
    <style>
        /* ডার্ক থিম ইন্টারফেস */
        body {
            margin: 0;
            padding: 0;
            background-color: #0f0f0f; /* Pure Dark Background */
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
        }

        /* প্লেয়ার কন্টেইনার */
        #player-container {
            width: 100%;
            background: #000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        #jwplayerDiv {
            width: 100%;
            aspect-ratio: 16 / 9;
        }

        /* টেলিগ্রাম বাটন প্রফেশনাল ডিজাইন */
        .action-bar {
            background-color: #1a1a1a;
            text-align: center;
            padding: 15px;
            border-bottom: 1px solid #333;
        }

        #joinTelegramButton {
            background: linear-gradient(135deg, #0088cc, #0074d9);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        #joinTelegramButton:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 136, 204, 0.4);
        }

        /* বিজ্ঞাপন সেকশন (Sticky Bottom) */
        .ad-wrapper {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(15, 15, 15, 0.95);
            border-top: 1px solid #333;
            padding: 5px 0;
            z-index: 9999;
            text-align: center;
        }

        /* ইউজার কাউন্টার স্টাইল */
        .counter-section {
            padding: 10px;
            background: #121212;
            font-size: 14px;
        }

        /* প্লেয়ারের স্কিন ডার্ক করা */
        .jw-skin-glow .jw-background-color {
            background-color: rgba(0, 0, 0, 0.8) !important;
        }
    </style>
    <script src="https://cdn.jwplayer.com/libraries/SAHhwvZq.js"></script>
</head>
<body>

    <div id="player-container">
        <div id="jwplayerDiv"></div>
    </div>

    <div class="action-bar">
        <a href="https://t.me/rslivetv" target="_blank" style="text-decoration: none;">
            <button id="joinTelegramButton">JOIN OUR TELEGRAM CHANNEL</button>
        </a>
    </div>

    <div class="counter-section">
        <center>
            <script type="text/javascript" src="//widget.supercounters.com/ssl/online_t.js"></script>
            <script type="text/javascript">
                sc_online_t(1707487, "Users Online", "ffffff"); /* কাউন্টার টেক্সট সাদা করা হয়েছে */
            </script>
        </center>
    </div>

    <script>
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        const hlsStreamUrl = getQueryParam("file");

        if (!hlsStreamUrl) {
            console.error("No HLS stream URL provided.");
        } else {
            const playerInstance = jwplayer("jwplayerDiv");

            playerInstance.setup({
                file: hlsStreamUrl,
                width: "100%",
                aspectratio: "16:9",
                autostart: true,
                mute: false,
                skin: {
                    name: "glow", // ডার্ক থিম স্কিন
                    active: "#0074d9",
                    inactive: "#ffffff",
                    background: "#000000"
                },
                type: "hls",
                preload: "auto",
                cast: {
                    appid: "CC1AD845"
                }
            });

            playerInstance.on('error', function(error) {
                document.getElementById('jwplayerDiv').innerHTML = `<div style="padding:20px; text-align:center;">Stream Loading Failed. Please Refresh.</div>`;
            });
        }

        // Security Scripts
        document.addEventListener("contextmenu", e => e.preventDefault());
        document.addEventListener("keydown", e => {
            if (e.key === "F12" || (e.ctrlKey && e.shiftKey && (e.key === "I" || e.key === "J")) || (e.ctrlKey && e.key === "U")) {
                e.preventDefault();
            }
        });
    </script>

    <div class="ad-wrapper">
        <script async="async" data-cfasync="false" src="//pl26377079.revenuecpmgate.com/cdeccdd75d3e2e6916a42ce9653cfb08/invoke.js"></script>
        <div id="container-cdeccdd75d3e2e6916a42ce9653cfb08"></div>
    </div>

</body>
</html>
