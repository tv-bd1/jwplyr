<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RS Live TV Player</title>

<link rel="icon" href="favicon.ico">

<script src="https://cdn.jwplayer.com/libraries/SAHhwvZq.js"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
font-family:Arial,sans-serif;
color:#fff;
overflow-x:hidden;
}

#player-container{
position:relative;
width:100%;
background:#000;
}

#jwplayerDiv{
width:100%;
}

.loader{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
z-index:999;
width:50px;
height:50px;
border:5px solid rgba(255,255,255,.2);
border-top:5px solid #00aaff;
border-radius:50%;
animation:spin 1s linear infinite;
}

@keyframes spin{
100%{
transform:translate(-50%,-50%) rotate(360deg);
}
}

.watermark{
position:absolute;
top:10px;
right:10px;
background:rgba(0,0,0,.6);
padding:6px 12px;
border-radius:20px;
font-size:12px;
font-weight:bold;
z-index:999;
}

.live{
position:absolute;
top:10px;
left:10px;
background:red;
padding:6px 12px;
border-radius:20px;
font-size:12px;
font-weight:bold;
z-index:999;
animation:pulse 1s infinite;
}

@keyframes pulse{
50%{
opacity:.5;
}
}

.telegram{
background:#111;
padding:15px;
text-align:center;
}

.telegram a{
display:inline-block;
padding:12px 25px;
background:#0088cc;
color:#fff;
text-decoration:none;
border-radius:30px;
font-weight:bold;
}

.telegram a:hover{
opacity:.9;
}

.counter{
padding:10px;
background:#111;
text-align:center;
}

.error-box{
padding:40px;
text-align:center;
font-size:18px;
color:#fff;
}

.ad-wrapper{
position:fixed;
bottom:0;
left:0;
width:100%;
background:#111;
border-top:1px solid #333;
text-align:center;
z-index:9999;
}

body{
padding-bottom:70px;
}
</style>
</head>
<body>

<div id="player-container">

<div class="loader" id="loader"></div>

<div class="live">
🔴 LIVE
</div>

<div class="watermark">
RS LIVE TV
</div>

<div id="jwplayerDiv"></div>

</div>

<div class="telegram">
<a href="https://t.me/rslivetv" target="_blank">
JOIN OUR TELEGRAM CHANNEL
</a>
</div>

<div class="counter">
<script src="//widget.supercounters.com/ssl/online_t.js"></script>
<script>
sc_online_t(1707487,"Users Online","ffffff");
</script>
</div>

<div class="ad-wrapper">
<script async data-cfasync="false"
src="//pl26377079.revenuecpmgate.com/cdeccdd75d3e2e6916a42ce9653cfb08/invoke.js"></script>
<div id="container-cdeccdd75d3e2e6916a42ce9653cfb08"></div>
</div>

<script>

function getParameterByName(name){
const url=new URL(window.location.href);
return url.searchParams.get(name);
}

const stream=getParameterByName("file");

if(!stream){

document.getElementById("loader").style.display="none";

document.getElementById("jwplayerDiv").innerHTML=
'<div class="error-box">No Stream Found</div>';

}else{

const player=jwplayer("jwplayerDiv");

player.setup({
file:stream,
width:"100%",
aspectratio:"16:9",
autostart:true,
mute:false,
preload:"auto",
type:"hls"
});

player.on("ready",function(){
document.getElementById("loader").style.display="none";
});

player.on("play",function(){
document.getElementById("loader").style.display="none";
});

player.on("buffer",function(){
document.getElementById("loader").style.display="block";
});

player.on("error",function(){

document.getElementById("loader").style.display="none";

document.getElementById("jwplayerDiv").innerHTML=
'<div class="error-box">⚠ Stream Offline<br>Retrying...</div>';

setTimeout(function(){
location.reload();
},5000);

});

player.on("fullscreen",function(e){

if(e.fullscreen){

if(screen.orientation &&
screen.orientation.lock){

screen.orientation.lock("landscape").catch(()=>{});

}

}else{

if(screen.orientation &&
screen.orientation.unlock){

screen.orientation.unlock();

}

}

});

}

document.addEventListener("contextmenu",e=>{
e.preventDefault();
});

</script>

</body>
</html>
